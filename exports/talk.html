      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "layout": {"data": {"cells": [{"type": "skip"}, {"type": "skip"}, {"speakerNotes": "Schakelaar: LIVE aan = echte API-calls; uit = recordings/. Knop 'opnieuw' herhaalt de demo's.", "type": "slide"}, {"type": "skip"}, {"speakerNotes": "Iedereen heeft dit geschreven. Het probleem is niet het LLM, het is dat tekst geen type is.", "type": "slide"}, {"speakerNotes": "Kahneman: snel/intu\u00eftief vs traag/bewust. Jev is System 1 voor je code.", "type": "slide"}, {"speakerNotes": "Geen tekst, wel kansen. Meerdere vragen per call, parallel beantwoord.", "type": "slide"}, {"speakerNotes": "Dit is de echte code uit demo 1. Choice/Score hebben confidence; Noul is zelf een kans.", "type": "slide"}, {"speakerNotes": "Live: \u00e9\u00e9n call, drie antwoorden. Wijs op de verdeling en de latency.", "type": "slide"}, {"speakerNotes": "Elf tickets, een paar bewust ambigu. Dan de slider: geen nieuwe API-calls.", "type": "slide"}, {"type": "fragment"}, {"speakerNotes": "Routing, gates, compaction, evals. Code houdt de controle.", "type": "slide"}, {"speakerNotes": "Het hoogtepunt: DROP TABLE op productie en het secrets-bestand worden geblokkeerd.", "type": "slide"}, {"speakerNotes": "Drie runs van dezelfde agent: geen gate, LLM-rechter, Jev-rechter. Het argument: met Jev kan de check op elke stap aan staan.", "type": "slide"}, {"speakerNotes": "Vendor-claims naast eigen metingen. Rode badge = placeholder, nog niet gemeten.", "type": "slide"}, {"speakerNotes": "Zelfde tickets en tool calls, zelfde criteria-tekst, twee systemen. Snelheid, kost en hoe vaak ze het eens zijn.", "type": "slide"}, {"speakerNotes": "Een LLM-antwoord is \u00e9\u00e9n sample. Twintig keer vragen reconstrueert de verdeling die Jev in \u00e9\u00e9n call geeft. Let op de zelfgerapporteerde confidence.", "type": "slide"}, {"speakerNotes": "Early access, alpha-packages, geen reasoning, calibratie is geen correctheid.", "type": "slide"}, {"speakerNotes": "Laat het LLM praten en plannen, laat System 1 kiezen. Repo-link.", "type": "slide"}], "deck": {"transition": "none", "verticalAlign": "top"}}, "type": "slides"},

"\u003E\u003Ch2\u003EDrie primitives + confidence\u003C/h2\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EConfidence\u003C/strong\u003E = hoe geconcentreerd de verdeling is. Niet: hoe \u003Cem\u003Ejuist\u003C/em\u003E het antwoord is.\u003C/span\u003E\u003C/span\u003E\u003Cdiv class=\"jev-cols\" style=\"grid-template-columns: 1.3fr 1fr\"\u003E\u003Cdiv\u003E\u003Cdiv class=\"jev-code\" style=\"font-size:1.1rem\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003EQUESTIONS\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"p\"\u003E{\u003C/span\u003E\n    \u003Cspan class=\"s2\"\u003E\"team\"\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"n\"\u003EChoice\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\n        \u003Cspan class=\"n\"\u003Einstructions\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"s2\"\u003E\"Which team should own this ticket?\"\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\n        \u003Cspan class=\"n\"\u003Ecriteria\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"n\"\u003ETEAMS\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E               \u003Cspan class=\"c1\"\u003E# label -\u0026gt; description (or None)\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E),\u003C/span\u003E\n    \u003Cspan class=\"s2\"\u003E\"urgency\"\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"n\"\u003EScore\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\n        \u003Cspan class=\"n\"\u003Einstructions\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"s2\"\u003E\"How urgent
