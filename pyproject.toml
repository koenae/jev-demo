[project]
name = "jev-demo"
version = "0.1.0"
description = "Demo's en marimo-presentatie voor de talk over TypeSafe Jev (System One)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typesafe-sdk==0.7.0",
    "langchain==1.4.2",
    "langchain-typesafe[experimental]==0.0.1a3",
    "langchain-openai==1.6.2",
    "langchain-anthropic==1.7.2",
    "marimo==0.24.2",
    "rich==15.0.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
export = [
    "nbformat==5.10.4",
    "nbconvert==7.16.6",
    "playwright==1.58.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
